# 내 프로젝트의 .github/workflows/security-check.yml 로 복사해서 쓰는 예시입니다.
# 스크립트는 main 이 아니라 태그(v0.1.0)나 커밋 해시로 고정해서 받으세요.
name: security-check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Git 이력 검사를 위해 전체 이력을 받음
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download check.sh (pinned)
        run: |
          curl -fsSL -o check.sh \
            https://raw.githubusercontent.com/jmineeekim/nextjs-supabase-security-check/v0.1.0/scripts/check.sh
          chmod +x check.sh
      - name: Run security check
        env:
          # 접두사 없는 비밀 값의 끝 20자 정도를 줄바꿈으로 구분해 넣습니다 (Settings > Secrets)
          SECRET_FRAGMENTS: ${{ secrets.SECRET_FRAGMENTS }}
          # 빌드에 필요한 공개 환경변수
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: ./check.sh --build --no-color .
